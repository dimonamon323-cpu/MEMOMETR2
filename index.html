<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мемометр</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: rgba(20, 20, 20, 0.78);
    --surface-2: rgba(30, 30, 30, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(212, 175, 55, 0.35);
    --text: #ededed;
    --text-strong: #ffffff;
    --muted: #8a8a8a;
    --gold: #d4af37;
    --gold-soft: #e8c86a;
    --gold-dim: rgba(212, 175, 55, 0.15);
    --red: #f87171;
    --green: #34d399;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    position: relative;
    background: var(--bg);
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -40px;
    background-image: url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80");
    background-size: cover;
    background-position: center;
    filter: blur(22px) brightness(0.32) saturate(0.6);
    z-index: -2;
    transform: scale(1.1);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(212,175,55,0.08), transparent 55%),
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.85) 100%);
    z-index: -1;
    pointer-events: none;
  }

  .container { max-width: 720px; margin: 0 auto; position: relative; }

  header { margin-bottom: 24px; text-align: center; }
  header h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #d4af37 130%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* ===== ТАБЫ ===== */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .tab {
    flex: 1;
    padding: 11px 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tab:hover { color: var(--text-strong); background: rgba(255,255,255,0.03); }
  .tab.active {
    background: var(--gold-dim);
    color: var(--gold-soft);
    box-shadow: 0 0 0 1px var(--border-hover) inset;
  }
  .tab .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font-weight: 700;
    min-width: 20px;
    text-align: center;
  }
  .tab.active .badge {
    background: rgba(212,175,55,0.2);
    color: var(--gold-soft);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 20px 60px rgba(0,0,0,0.5);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  input[type="text"], input[type="url"], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.35);
    color: var(--text-strong);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder, textarea::placeholder { color: #555; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--border-hover);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
  }
  textarea { resize: vertical; min-height: 70px; }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .char-count {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  input[type="file"] { display: none; }

  .file-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-strong);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .file-btn:hover {
    background: var(--gold-dim);
    border-color: var(--border-hover);
    color: var(--gold-soft);
  }

  .preview {
    max-width: 100%;
    max-height: 260px;
    margin-top: 12px;
    border-radius: 10px;
    display: none;
    border: 1px solid var(--border);
  }

  .criteria-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    margin-top: 22px;
  }
  .criteria-header h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-strong);
  }
  .criteria-header span {
    font-size: 11px;
    color: var(--gold-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .criterion {
    padding: 15px 0;
    border-bottom: 1px solid var(--border);
  }
  .criterion:last-child { border-bottom: none; }

  .criterion-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .criterion-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-strong);
  }
  .criterion-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .criterion-val {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-soft);
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--gold);
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 16px rgba(212,175,55,0.9);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--gold);
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
    cursor: pointer;
  }

  .total-box {
    margin-top: 24px;
    padding: 22px;
    background: linear-gradient(180deg, rgba(212,175,55,0.06), rgba(212,175,55,0.02));
    border: 1px solid var(--border-hover);
    border-radius: 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .total-box::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }
  .total-score {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--text-strong);
    text-shadow: 0 0 24px rgba(212,175,55,0.25);
    line-height: 1;
  }
  .total-score small {
    font-size: 18px;
    color: var(--gold-soft);
    font-weight: 500;
    margin-left: 4px;
  }
  .total-rank {
    font-size: 13px;
    color: var(--gold-soft);
    margin-top: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff, #e8e8e8);
    color: #0a0a0a;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 20px;
    font-family: inherit;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 20px rgba(255,255,255,0.08);
  }
  .btn:hover {
    background: linear-gradient(180deg, #ffffff, #d4af37);
    box-shadow: 0 6px 28px rgba(212,175,55,0.35);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-hover);
    color: var(--gold-soft);
    box-shadow: none;
  }
  .btn-ghost:hover {
    background: var(--gold-dim);
    color: var(--gold-soft);
  }

  /* ===== КАРТОЧКА МЕМА ===== */
  .mem-item {
    display: flex;
    gap: 14px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    align-items: flex-start;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .mem-item:hover { border-color: var(--border-hover); }

  .mem-item img {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .mem-info { flex: 1; min-width: 0; }

  .mem-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    word-break: break-word;
    color: var(--text-strong);
    line-height: 1.3;
  }
  .mem-title a {
    color: var(--gold-soft);
    text-decoration: none;
    font-size: 12px;
    margin-left: 6px;
    font-weight: 400;
  }
  .mem-title a:hover { text-decoration: underline; }

  .mem-review {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 8px;
    padding: 9px 12px;
    background: rgba(255,255,255,0.025);
    border-left: 2px solid var(--gold);
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0.92;
  }

  .mem-scores {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .mem-date {
    font-size: 11px;
    color: #525252;
  }

  .mem-score {
    text-align: right;
    flex-shrink: 0;
    min-width: 80px;
  }
  .mem-score-num {
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--gold-soft);
    line-height: 1;
    text-shadow: 0 0 16px rgba(212,175,55,0.3);
  }
  .mem-score-rank {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .mem-score-votes {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
  }

  .delete-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .delete-btn:hover {
    border-color: var(--red);
    color: var(--red);
    background: rgba(248,113,113,0.08);
  }

  /* ===== КНОПКА "ОЦЕНИТЬ" и "ПОКАЗАТЬ ОЦЕНКИ" ===== */
  .mem-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .mini-btn {
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .mini-btn:hover {
    border-color: var(--border-hover);
    background: var(--gold-dim);
    color: var(--gold-soft);
  }
  .mini-btn.voted {
    color: var(--green);
    border-color: rgba(52,211,153,0.3);
    cursor: default;
  }
  .mini-btn.voted:hover { background: rgba(255,255,255,0.03); }

  /* ===== СПИСОК ГОЛОСОВ ===== */
  .votes-list {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
  }
  .votes-list.open { display: block; }
  .vote-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .vote-row:last-child { border-bottom: none; }
  .vote-user {
    color: var(--muted);
    font-size: 11px;
    font-family: ui-monospace, monospace;
  }
  .vote-score {
    font-weight: 700;
    color: var(--gold-soft);
    font-variant-numeric: tabular-nums;
  }
  .vote-score small {
    color: var(--muted);
    font-weight: 400;
    font-size: 10px;
    margin-left: 4px;
  }
  .votes-empty {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }

  /* ===== МОДАЛКА ===== */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: #141414;
    border: 1px solid var(--border-hover);
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal h2 {
    font-size: 18px;
    margin-bottom: 4px;
    color: var(--text-strong);
  }
  .modal-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 18px;
    word-break: break-word;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .modal-close:hover { color: var(--text-strong); background: rgba(255,255,255,0.05); }

  .modal-wrap { position: relative; }

  .modal .btn {
    margin-top: 16px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  @media (max-width: 500px) {
    body { padding: 20px 12px; }
    .card { padding: 18px; }
    .total-score { font-size: 36px; }
    header h1 { font-size: 24px; }
    .tab { font-size: 12px; padding: 10px 6px; }
    .tab .badge { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Мемометр</h1>
    <p>Оцени мем по шести критериям · максимум 90</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="fresh">Свежие <span class="badge" id="badgeFresh">0</span></button>
    <button class="tab" data-tab="top">Топ <span class="badge" id="badgeTop">0</span></button>
    <button class="tab" data-tab="add">Добавить</button>
    <button class="tab" data-tab="mine">Мои <span class="badge" id="badgeMine">0</span></button>
  </div>

  <div class="tab-panel active" id="panel-fresh">
    <div id="listFresh"></div>
  </div>

  <div class="tab-panel" id="panel-top">
    <div id="listTop"></div>
  </div>

  <div class="tab-panel" id="panel-add">
    <div class="card">
      <div class="field">
        <label>Ссылка на мем</label>
        <input type="url" id="memUrl" placeholder="https://...">
      </div>

      <div class="field">
        <label>Или изображение</label>
        <label for="memFile" class="file-btn">📎 Выбрать файл</label>
        <input type="file" id="memFile" accept="image/*">
        <img id="preview" class="preview" alt="">
      </div>

      <div class="field">
        <label>Название мема</label>
        <input type="text" id="memTitle" placeholder="Коротко: «Кот в наушниках»" maxlength="100">
        <div class="char-count" id="titleCount">0 / 100</div>
      </div>

      <div class="field">
        <label>Рецензия</label>
        <textarea id="memDesc" placeholder="Почему такая оценка? Что зашло, что нет, насколько смешно..." maxlength="1000"></textarea>
        <div class="char-count" id="descCount">0 / 1000</div>
      </div>

      <div class="criteria-header">
        <h2>Твоя оценка</h2>
        <span>0 – 15 каждый</span>
      </div>

      <div id="criteria"></div>

      <div class="total-box">
        <div class="total-score" id="total">0<small>/ 90</small></div>
        <div class="total-rank" id="rank">—</div>
      </div>

      <button class="btn" id="saveBtn">Сохранить мем</button>
    </div>
  </div>

  <div class="tab-panel" id="panel-mine">
    <div id="listMine"></div>
  </div>
</div>

<!-- МОДАЛКА ГОЛОСОВАНИЯ -->
<div class="modal-backdrop" id="voteModal">
  <div class="modal modal-wrap">
    <button class="modal-close" id="voteClose">×</button>
    <h2>Оценить мем</h2>
    <div class="modal-sub" id="voteModalTitle"></div>
    <div id="voteCriteria"></div>
    <div class="total-box">
      <div class="total-score" id="voteTotal">0<small>/ 90</small></div>
      <div class="total-rank" id="voteRank">—</div>
    </div>
    <button class="btn" id="voteSubmit">Отправить оценку</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, getDoc, setDoc,
  onSnapshot, query, orderBy, serverTimestamp, collectionGroup
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOWy3ZIZpNs61IRVD3QofBANAV-5AOv80",
  authDomain: "memometr-99425.firebaseapp.com",
  projectId: "memometr-99425",
  storageBucket: "memometr-99425.firebasestorage.app",
  messagingSenderId: "429277144377",
  appId: "1:429277144377:web:90b53870cd00df394534e8",
  measurementId: "G-GXY6T3KQXC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ===== ТАБЫ ===== */
const tabs = document.querySelectorAll(".tab");
const panels = {
  fresh: document.getElementById("panel-fresh"),
  top:   document.getElementById("panel-top"),
  add:   document.getElementById("panel-add"),
  mine:  document.getElementById("panel-mine")
};

tabs.forEach(t => {
  t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("active"));
    Object.values(panels).forEach(p => p.classList.remove("active"));
    t.classList.add("active");
    panels[t.dataset.tab].classList.add("active");
  });
});

/* ===== КРИТЕРИИ ===== */
const criteria = [
  { key: "Смех",               desc: "Засмеялся ли вообще" },
  { key: "Длина смеха",        desc: "Сколько по времени ржал" },
  { key: "Громкость смеха",    desc: "Насколько громко" },
  { key: "Свежесть",           desc: "Видел раньше или нет" },
  { key: "Повторяемость",      desc: "Сколько раз ещё рассмешит" },
  { key: "Реакция при повторе",desc: "Смешно ли при пересмотре" }
];

const ranks = [
  { min: 0,  max: 20, label: "Не прикол" },
  { min: 21, max: 40, label: "Слабенько" },
  { min: 41, max: 60, label: "Норм мем" },
  { min: 61, max: 75, label: "Жиза" },
  { min: 76, max: 89, label: "В сохранёнки" },
  { min: 90, max: 90, label: "Мем года" }
];

function getRank(total) {
  return (ranks.find(r => total >= r.min && total <= r.max) || {}).label || "";
}

/* ===== ГЕНЕРАЦИЯ СЛАЙДЕРОВ (переиспользуется) ===== */
function buildSliders(container, idPrefix) {
  container.innerHTML = "";
  criteria.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "criterion";
    div.innerHTML = `
      <div class="criterion-top">
        <div>
          <div class="criterion-name">${c.key}</div>
          <div class="criterion-desc">${c.desc}</div>
        </div>
        <div class="criterion-val" id="${idPrefix}val${i}">0</div>
      </div>
      <input type="range" min="0" max="15" value="0" id="${idPrefix}crit${i}">
    `;
    container.appendChild(div);
  });
}

/* ===== ФОРМА ДОБАВЛЕНИЯ ===== */
buildSliders(document.getElementById("criteria"), "add");

function getAddScores() {
  return criteria.map((_, i) => +document.getElementById("addcrit" + i).value);
}

function updateAddTotal() {
  let total = 0;
  criteria.forEach((_, i) => {
    const v = +document.getElementById("addcrit" + i).value;
    document.getElementById("addval" + i).textContent = v;
    total += v;
  });
  document.getElementById("total").innerHTML = `${total}<small>/ 90</small>`;
  document.getElementById("rank").textContent = getRank(total);
}

criteria.forEach((_, i) => {
  document.getElementById("addcrit" + i).addEventListener("input", updateAddTotal);
});
