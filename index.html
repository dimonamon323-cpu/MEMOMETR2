<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мемометр</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: rgba(20, 20, 20, 0.78);
    --surface-2: rgba(30, 30, 30, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(212, 175, 55, 0.35);
    --text: #ededed;
    --text-strong: #ffffff;
    --muted: #8a8a8a;
    --gold: #d4af37;
    --gold-soft: #e8c86a;
    --gold-dim: rgba(212, 175, 55, 0.15);
    --red: #f87171;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    position: relative;
    background: var(--bg);
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -40px;
    background-image: url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80");
    background-size: cover;
    background-position: center;
    filter: blur(22px) brightness(0.32) saturate(0.6);
    z-index: -2;
    transform: scale(1.1);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(212,175,55,0.08), transparent 55%),
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.85) 100%);
    z-index: -1;
    pointer-events: none;
  }

  .container { max-width: 720px; margin: 0 auto; position: relative; }

  header { margin-bottom: 24px; text-align: center; }
  header h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #d4af37 130%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* ===== ТАБЫ ===== */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .tab {
    flex: 1;
    padding: 11px 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tab:hover { color: var(--text-strong); background: rgba(255,255,255,0.03); }
  .tab.active {
    background: var(--gold-dim);
    color: var(--gold-soft);
    box-shadow: 0 0 0 1px var(--border-hover) inset;
  }
  .tab .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font-weight: 700;
    min-width: 20px;
    text-align: center;
  }
  .tab.active .badge {
    background: rgba(212,175,55,0.2);
    color: var(--gold-soft);
  }

  /* ===== КОНТЕНТ ТАБОВ ===== */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 20px 60px rgba(0,0,0,0.5);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  input[type="text"], input[type="url"], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.35);
    color: var(--text-strong);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder, textarea::placeholder { color: #555; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--border-hover);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
  }
  textarea { resize: vertical; min-height: 70px; }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .char-count {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  input[type="file"] { display: none; }

  .file-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-strong);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .file-btn:hover {
    background: var(--gold-dim);
    border-color: var(--border-hover);
    color: var(--gold-soft);
  }

  .preview {
    max-width: 100%;
    max-height: 260px;
    margin-top: 12px;
    border-radius: 10px;
    display: none;
    border: 1px solid var(--border);
  }

  .criteria-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    margin-top: 22px;
  }
  .criteria-header h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-strong);
  }
  .criteria-header span {
    font-size: 11px;
    color: var(--gold-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .criterion {
    padding: 15px 0;
    border-bottom: 1px solid var(--border);
  }
  .criterion:last-child { border-bottom: none; }

  .criterion-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .criterion-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-strong);
  }
  .criterion-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .criterion-val {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-soft);
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--gold);
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 16px rgba(212,175,55,0.9);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--gold);
    box-shadow: 0 0 10px rgba(212,175,55,0.5);
    cursor: pointer;
  }

  .total-box {
    margin-top: 24px;
    padding: 22px;
    background: linear-gradient(180deg, rgba(212,175,55,0.06), rgba(212,175,55,0.02));
    border: 1px solid var(--border-hover);
    border-radius: 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .total-box::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }
  .total-score {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--text-strong);
    text-shadow: 0 0 24px rgba(212,175,55,0.25);
    line-height: 1;
  }
  .total-score small {
    font-size: 18px;
    color: var(--gold-soft);
    font-weight: 500;
    margin-left: 4px;
  }
  .total-rank {
    font-size: 13px;
    color: var(--gold-soft);
    margin-top: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff, #e8e8e8);
    color: #0a0a0a;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 20px;
    font-family: inherit;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 20px rgba(255,255,255,0.08);
  }
  .btn:hover {
    background: linear-gradient(180deg, #ffffff, #d4af37);
    box-shadow: 0 6px 28px rgba(212,175,55,0.35);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ===== КАРТОЧКА МЕМА ===== */
  .mem-item {
    display: flex;
    gap: 14px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    align-items: flex-start;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .mem-item:hover {
    border-color: var(--border-hover);
  }

  .mem-item img {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .mem-info { flex: 1; min-width: 0; }

  .mem-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    word-break: break-word;
    color: var(--text-strong);
    line-height: 1.3;
  }
  .mem-title a {
    color: var(--gold-soft);
    text-decoration: none;
    font-size: 12px;
    margin-left: 6px;
    font-weight: 400;
  }
  .mem-title a:hover { text-decoration: underline; }

  .mem-review {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 8px;
    padding: 9px 12px;
    background: rgba(255,255,255,0.025);
    border-left: 2px solid var(--gold);
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0.92;
  }

  .mem-scores {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .mem-date {
    font-size: 11px;
    color: #525252;
  }

  .mem-score {
    text-align: right;
    flex-shrink: 0;
  }
  .mem-score-num {
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--gold-soft);
    line-height: 1;
    text-shadow: 0 0 16px rgba(212,175,55,0.3);
  }
  .mem-score-rank {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    max-width: 90px;
  }

  .delete-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .delete-btn:hover {
    border-color: var(--red);
    color: var(--red);
    background: rgba(248,113,113,0.08);
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  @media (max-width: 500px) {
    body { padding: 20px 12px; }
    .card { padding: 18px; }
    .total-score { font-size: 36px; }
    header h1 { font-size: 24px; }
    .tab { font-size: 12px; padding: 10px 6px; }
    .tab .badge { display: none; }
    .mem-score-rank { max-width: 70px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Мемометр</h1>
    <p>Оцени мем по шести критериям · максимум 90</p>
  </header>

  <!-- ТАБЫ -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="fresh">Свежие <span class="badge" id="badgeFresh">0</span></button>
    <button class="tab" data-tab="top">Топ <span class="badge" id="badgeTop">0</span></button>
    <button class="tab" data-tab="add">Добавить</button>
    <button class="tab" data-tab="mine">Мои <span class="badge" id="badgeMine">0</span></button>
  </div>

  <!-- ПАНЕЛЬ: СВЕЖИЕ -->
  <div class="tab-panel active" id="panel-fresh">
    <div id="listFresh"></div>
  </div>

  <!-- ПАНЕЛЬ: ТОП -->
  <div class="tab-panel" id="panel-top">
    <div id="listTop"></div>
  </div>

  <!-- ПАНЕЛЬ: ДОБАВИТЬ -->
  <div class="tab-panel" id="panel-add">
    <div class="card">
      <div class="field">
        <label>Ссылка на мем</label>
        <input type="url" id="memUrl" placeholder="https://...">
      </div>

      <div class="field">
        <label>Или изображение</label>
        <label for="memFile" class="file-btn">📎 Выбрать файл</label>
        <input type="file" id="memFile" accept="image/*">
        <img id="preview" class="preview" alt="">
      </div>

      <div class="field">
        <label>Название мема</label>
        <input type="text" id="memTitle" placeholder="Коротко: «Кот в наушниках»" maxlength="100">
        <div class="char-count" id="titleCount">0 / 100</div>
      </div>

      <div class="field">
        <label>Рецензия</label>
        <textarea id="memDesc" placeholder="Почему такая оценка? Что зашло, что нет, насколько смешно..." maxlength="1000"></textarea>
        <div class="char-count" id="descCount">0 / 1000</div>
      </div>

      <div class="criteria-header">
        <h2>Критерии</h2>
        <span>0 – 15 каждый</span>
      </div>

      <div id="criteria"></div>

      <div class="total-box">
        <div class="total-score" id="total">0<small>/ 90</small></div>
        <div class="total-rank" id="rank">—</div>
      </div>

      <button class="btn" id="saveBtn">Сохранить мем</button>
    </div>
  </div>

  <!-- ПАНЕЛЬ: МОИ -->
  <div class="tab-panel" id="panel-mine">
    <div id="listMine"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOWy3ZIZpNs61IRVD3QofBANAV-5AOv80",
  authDomain: "memometr-99425.firebaseapp.com",
  projectId: "memometr-99425",
  storageBucket: "memometr-99425.firebasestorage.app",
  messagingSenderId: "429277144377",
  appId: "1:429277144377:web:90b53870cd00df394534e8",
  measurementId: "G-GXY6T3KQXC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const memesCol = collection(db, "memes");

let currentUser = null;
let allMemes = [];

signInAnonymously(auth).catch(err => {
  console.error("Ошибка входа:", err);
  alert("Не удалось войти. Проверь Anonymous в Firebase Auth.");
});

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  renderAll();
});

/* ===== ТАБЫ ===== */
const tabs = document.querySelectorAll(".tab");
const panels = {
  fresh: document.getElementById("panel-fresh"),
  top:   document.getElementById("panel-top"),
  add:   document.getElementById("panel-add"),
  mine:  document.getElementById("panel-mine")
};

tabs.forEach(t => {
  t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("active"));
    Object.values(panels).forEach(p => p.classList.remove("active"));
    t.classList.add("active");
    panels[t.dataset.tab].classList.add("active");
  });
});

/* ===== КРИТЕРИИ ===== */
const criteria = [
  { key: "Смех",               desc: "Засмеялся ли вообще" },
  { key: "Длина смеха",        desc: "Сколько по времени ржал" },
  { key: "Громкость смеха",    desc: "Насколько громко" },
  { key: "Свежесть",           desc: "Видел раньше или нет" },
  { key: "Повторяемость",      desc: "Сколько раз ещё рассмешит" },
  { key: "Реакция при повторе",desc: "Смешно ли при пересмотре" }
];

const ranks = [
  { min: 0,  max: 20, label: "Не прикол" },
  { min: 21, max: 40, label: "Слабенько" },
  { min: 41, max: 60, label: "Норм мем" },
  { min: 61, max: 75, label: "Жиза" },
  { min: 76, max: 89, label: "В сохранёнки" },
  { min: 90, max: 90, label: "Мем года" }
];

const critBox = document.getElementById("criteria");
criteria.forEach((c, i) => {
  const div = document.createElement("div");
  div.className = "criterion";
  div.innerHTML = `
    <div class="criterion-top">
      <div>
        <div class="criterion-name">${c.key}</div>
        <div class="criterion-desc">${c.desc}</div>
      </div>
      <div class="criterion-val" id="val${i}">0</div>
    </div>
    <input type="range" min="0" max="15" value="0" id="crit${i}">
  `;
  critBox.appendChild(div);
});

function getScores() {
  return criteria.map((_, i) => +document.getElementById("crit" + i).value);
}

function updateTotal() {
  let total = 0;
  criteria.forEach((_, i) => {
    const v = +document.getElementById("crit" + i).value;
    document.getElementById("val" + i).textContent = v;
    total += v;
  });
  document.getElementById("total").innerHTML = `${total}<small>/ 90</small>`;
  const r = ranks.find(r => total >= r.min && total <= r.max);
  document.getElementById("rank").textContent = r ? r.label : "";
}

criteria.forEach((_, i) => {
  document.getElementById("crit" + i).addEventListener("input", updateTotal);
});

/* ===== СЧЁТЧИКИ СИМВОЛОВ ===== */
const memTitleEl = document.getElementById("memTitle");
const memDescEl  = document.getElementById("memDesc");

memTitleEl.addEventListener("input", () => {
  document.getElementById("titleCount").textContent = `${memTitleEl.value.length} / 100`;
});
memDescEl.addEventListener("input", () => {
  document.getElementById("descCount").textContent = `${memDescEl.value.length} / 1000`;
});

/* ===== ПРЕВЬЮ ===== */
const fileInput = document.getElementById("memFile");
const preview = document.getElementById("preview");
fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    preview.src = ev.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

/* ===== СОХРАНЕНИЕ ===== */
document.getElementById("saveBtn").addEventListener("click", async () => {
  if (!currentUser) {
    alert("Подожди секунду, идёт вход...");
    return;
  }

  const scores = getScores();
  const total = scores.reduce((a, b) => a + b, 0);
  const rank = (ranks.find(r => total >= r.min && total <= r.max) || {}).label || "";

  const meme = {
    url: document.getElementById("memUrl").value.trim(),
    image: preview.style.display === "block" ? preview.src : "",
    title: memTitleEl.value.trim(),
    desc: memDescEl.value.trim(),
    scores, total, rank,
    authorId: currentUser.uid,
    createdAt: serverTimestamp()
  };

  if (!meme.title && !meme.url && !meme.image) {
    alert("Добавь хотя бы название, ссылку или картинку");
    return;
  }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "Сохранение...";

  try {
    await addDoc(memesCol, meme);
    resetForm();
    btn.textContent = "Сохранено ✓";
    setTimeout(() => {
      btn.textContent = "Сохранить мем";
      btn.disabled = false;
      document.querySelector('.tab[data-tab="fresh"]').click();
    }, 800);
  } catch (e) {
    alert("Ошибка: " + e.message);
    btn.textContent = "Сохранить мем";
    btn.disabled = false;
  }
});

function resetForm() {
  document.getElementById("memUrl").value = "";
  memTitleEl.value = "";
  memDescEl.value = "";
  document.getElementById("titleCount").textContent = "0 / 100";
  document.getElementById("descCount").textContent = "0 / 1000";
  document.getElementById("memFile").value = "";
  preview.src = "";
  preview.style.display = "none";
  criteria.forEach((_, i) => document.getElementById("crit" + i).value = 0);
  updateTotal();
}

/* ===== ЖИВАЯ ПОДПИСКА ===== */
const q = query(memesCol, orderBy("createdAt", "desc"));
onSnapshot(q, (snapshot) => {
  allMemes = [];
  snapshot.forEach(d => {
    const data = d.data();
    if (data.test === "1" || data.test === 1) return;
    allMemes.push({ id: d.id, ...data });
  });
  renderAll();
});

function renderAll() {
  const mine = allMemes.filter(m => currentUser && m.authorId === currentUser.uid);

  renderList("listFresh", allMemes, false);

  const top = [...allMemes].sort((a, b) => (b.total || 0) - (a.total || 0));
  renderList("listTop", top, false);

  renderList("listMine", mine, true);

  document.getElementById("badgeFresh").textContent = allMemes.length;
  document.getElementById("badgeTop").textContent = allMemes.length;
  document.getElementById("badgeMine").textContent = mine.length;
}

function renderList(containerId, list, showDelete) {
  const box = document.getElementById(containerId);

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${showDelete ? "📝" : "🖼️"}</div>
        ${showDelete ? "Ты ещё ничего не добавил" : "Пока ничего не оценено"}
      </div>`;
    return;
  }

  box.innerHTML = "";
  list.forEach(m => {
    // Поддержка старых мемов: если нет title — показываем desc как название
    const title = m.title || (m.desc ? "" : "");
    const review = m.desc || "";
    const hasTitle = !!m.title;

    const div = document.createElement("div");
    div.className = "mem-item";
    const img = m.image ? `<img src="${m.image}" alt="">` : "";
    const link = m.url ? `<a href="${m.url}" target="_blank" rel="noopener">открыть ↗</a>` : "";
    const details = (m.scores || []).map((s, i) => `${criteria[i].key} ${s}`).join(" · ");

    let dateStr = "";
    if (m.createdAt?.toDate) {
      dateStr = m.createdAt.toDate().toLocaleString("ru-RU", {
        day: "2-digit", month: "2-digit", year: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
    }

    // Если старый мем — без title, то desc рендерим как название
    const titleHtml = hasTitle
      ? `<div class="mem-title">${escapeHtml(title)}${link}</div>`
      : (review ? `<div class="mem-title">${escapeHtml(review)}${link}</div>` : `<div class="mem-title" style="color:#525252">(без названия)${link}</div>`);

    const reviewHtml = (hasTitle && review)
      ? `<div class="mem-review">${escapeHtml(review)}</div>`
      : "";

    div.innerHTML = `
      ${img}
      <div class="mem-info">
        ${titleHtml}
        ${reviewHtml}
        <div class="mem-scores">${details}</div>
        <div class="mem-date">${dateStr}</div>
      </div>
      <div class="mem-score">
        <div class="mem-score-num">${m.total}</div>
        <div class="mem-score-rank">${m.rank}</div>
      </div>
      ${showDelete ? `<button class="delete-btn" data-id="${m.id}">✕</button>` : ""}
    `;

    const delBtn = div.querySelector(".delete-btn");
    if (delBtn) delBtn.addEventListener("click", () => deleteMeme(m.id));

    box.appendChild(div);
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function deleteMeme(id) {
  if (!confirm("Удалить этот мем?")) return;
  try {
    await deleteDoc(doc(db, "memes", id));
  } catch (e) {
    alert("Ошибка удаления: " + e.message);
  }
}

updateTotal();
</script>
